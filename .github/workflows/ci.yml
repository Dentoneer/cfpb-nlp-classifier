name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          if [ -f pyproject.toml ]; then pip install -e ".[dev]"; fi

      - name: Lint
        run: ruff check .

      - name: Test
        # Exit code 5 = no tests collected yet; treat as pass until the first tests land.
        run: pytest -q || [ $? -eq 5 ]

      - name: Check notebooks
        run: python -m nlp.tools.check_notebooks notebooks/
