name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]  # 3.11 = minimum supported; 3.13 = Colab's Python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          if [ -f pyproject.toml ]; then pip install -e ".[dev]"; fi

      - name: Lint
        run: ruff check .

      - name: Test
        # Exit code 5 = no tests collected yet; treat as pass until the first tests land.
        run: pytest -q || [ $? -eq 5 ]

      - name: Check notebooks
        run: python -m nlp.tools.check_notebooks notebooks/

  # The protect-main ruleset requires a check named `lint-and-test`; it passes only when every
  # Python version above passed.
  lint-and-test:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All Python versions passed
        run: test "${{ needs.test.result }}" = "success"
